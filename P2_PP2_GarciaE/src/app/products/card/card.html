<div class="card">
  <img [src]="image" alt="{{ name }}" class="program-image" />

  <h3>{{ name }}</h3>
  <p>{{ description }}</p>

  <div class="controls">
    <button (click)="decrementarParticipantes()">-</button>
    <span>Personas</span>
    <button (click)="incrementarParticipantes()">+</button>
  </div>

  <p><strong>Total de Personas: {{ participantes() }}</strong></p>
</div>
